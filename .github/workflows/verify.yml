name: Verify source and generated release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test -- --run

      - name: Build production, standalone and release outputs
        run: npm run build:release

      - name: Confirm the committed deployment files are current
        run: >-
          git diff --exit-code --
          demo/accessible-nasa-tlx-v0.7.html
          demo/accessible-questionnaire-platform-v0.8.html
          ../index.html
          ../study.html
          ../assets
          ../questionnaires

  sync-pages:
    name: Sync verified main to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the deployment branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Replace its file tree with the verified main revision
        env:
          VERIFIED_MAIN_SHA: ${{ github.sha }}
        run: |
          git fetch origin "$VERIFIED_MAIN_SHA"
          git read-tree --reset -u "$VERIFIED_MAIN_SHA"
          if git diff --cached --quiet; then
            echo "GitHub Pages already matches verified main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy verified main ${VERIFIED_MAIN_SHA}"
          git push origin HEAD:gh-pages
