name: Verify source and generated release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test -- --run

      - name: Build production, standalone and release outputs
        run: npm run build:release

      - name: Confirm the committed deployment files are current
        run: >-
          git diff --exit-code --
          demo/accessible-nasa-tlx-v0.7.html
          demo/accessible-questionnaire-platform-v0.8.html
          ../index.html
          ../study.html
          ../assets
          ../questionnaires
